<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
     <style>
        #map { height: 500px; }
        .popup-image{
            max-width: 200px;
            height: 50px;
        }
     </style>

</head>
<body>
    <h1>Basic Map</h1>
    <div id = "map"></div>
</body>
<script>

var map = L.map('map').setView([8.360211288261135, 124.86874672552656], 17);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

var marker = L.marker([8.360211288261135, 124.86874672552656]).addTo(map);
const StitchImage = "<img src= 'https://upload.wikimedia.org/wikipedia/en/thumb/d/d2/Stitch_%28Lilo_%26_Stitch%29.svg/868px-Stitch_%28Lilo_%26_Stitch%29.svg.png' class='popup-image'>";
const popupContent = `${StitchImage}<br><b>Hello world!</b>b<>br>I am a popup.`;

marker.bindPopup(popupContent),openPopup();
</script>
</html>
